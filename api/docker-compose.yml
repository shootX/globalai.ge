services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: globalai
      POSTGRES_USER: globalai
      POSTGRES_PASSWORD: globalai
    ports:
      - "5432:5432"
    volumes:
      - globalai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globalai -d globalai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8088:8000"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

volumes:
  globalai_pg:
